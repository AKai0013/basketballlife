name: Preview growth UI QA

on:
  push:
    branches:
      - preview/growth-ui-v1
    paths:
      - index.html
      - functions/**
      - qa/**
      - preview-growth.css
      - preview-growth-core.js
      - preview-public-read.js
      - .github/workflows/preview-growth-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-growth-ui-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_URL: https://preview-growth-ui-v1.basketballlife.pages.dev/
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for the current Cloudflare branch preview
        shell: bash
        run: |
          for attempt in {1..60}; do
            html=$(curl -L -sS "$PREVIEW_URL?qa_wait=$GITHUB_SHA" || true)
            core=$(curl -L -sS "$PREVIEW_URL/preview-growth-core.js?qa_wait=$GITHUB_SHA" || true)
            if grep -q 'preview-growth-core.js' <<<"$html" \
              && grep -q 'preview-public-read.js' <<<"$html" \
              && grep -q 'bl_growth_funnel_v1' <<<"$core" \
              && grep -q 'weeklyChallengeTiming' <<<"$core"; then
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Preview did not expose the current growth patch" >&2
          exit 1

      - name: Run desktop, 390px and 430px funnel validation
        run: node qa/preview-growth-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-growth-ui-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
